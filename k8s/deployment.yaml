apiVersion: apps/v1
kind: Deployment
metadata:
  name: coderwanda-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coderwanda-webapp
  template:
    metadata:
      labels:
        app: coderwanda-webapp
    spec:
      containers:
        - name: webapp
          image: coderwanda-webapp:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000